<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor Integrado DSOS</title>
  <link rel="stylesheet" href="styles.css?v=20260903-2">
</head>

<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brandTop">SUNASS · DSOS</div>
      <h1 id="brandTitle"></h1>
      <p id="entity"></p>
    </div>

    <nav class="nav">
      <button id="homeBtn" class="homeBtn active">
        <span>🏠</span>
        <span>Inicio</span>
      </button>

      <div id="groupMenu"></div>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div id="pageTitle" class="pageTitle">Inicio</div>

      <div class="topActions">
        <button id="backHome">Inicio</button>
        <button id="openExternal" disabled>Abrir en nueva pestaña</button>
      </div>
    </header>

    <section class="content">

      <div id="home" class="home">
        <section class="hero">
          <div>
            <span class="heroTag">PORTAL DE INFORMACIÓN</span>
            <h2 id="heroTitle"></h2>
            <p>Seleccione un módulo para acceder al dashboard o visor correspondiente.</p>
          </div>
        </section>

        <div id="homeGroups"></div>
      </div>

      <div id="viewer" class="viewer">
        <iframe id="reportFrame" allowfullscreen title="Visor DSOS"></iframe>
      </div>

      <div id="pending" class="pendingScreen">
        <div class="pendingBox">
          <div class="pendingIcon">⏳</div>
          <h2 id="pendingTitle"></h2>
          <span class="badge pendingBadge">Próximamente</span>
        </div>
      </div>

    </section>
  </main>

</div>

<script src="config.js?v=20260904-1"></script>
<script>
let currentUrl = "";

const home = document.getElementById("home");
const viewer = document.getElementById("viewer");
const pending = document.getElementById("pending");
const frame = document.getElementById("reportFrame");
const title = document.getElementById("pageTitle");
const openExternal = document.getElementById("openExternal");

document.title = CONFIG.tituloPortal;
document.getElementById("brandTitle").textContent = CONFIG.tituloPortal;
document.getElementById("heroTitle").textContent = CONFIG.tituloPortal;
document.getElementById("entity").textContent = CONFIG.entidad;

function clearActive() {
  document.querySelectorAll(".navReport, .homeBtn").forEach(x => x.classList.remove("active"));
}

function showHome() {
  clearActive();
  document.getElementById("homeBtn").classList.add("active");
  currentUrl = "";
  title.textContent = "Inicio";
  openExternal.disabled = true;
  frame.src = "about:blank";
  home.style.display = "block";
  viewer.style.display = "none";
  pending.style.display = "none";
}

function openReport(report, button) {
  clearActive();
  if (button) button.classList.add("active");

  title.textContent = report.nombre;

  if (!report.activo || !report.url) {
    currentUrl = "";
    openExternal.disabled = true;
    document.getElementById("pendingTitle").textContent = report.nombre;
    home.style.display = "none";
    viewer.style.display = "none";
    pending.style.display = "flex";
    return;
  }

  currentUrl = report.url;
  openExternal.disabled = false;
  frame.src = report.url;

  home.style.display = "none";
  pending.style.display = "none";
  viewer.style.display = "block";
}

function reportByGroup(groupId) {
  return CONFIG.reportes.filter(r => r.grupo === groupId);
}

/* Menú lateral agrupado */
const groupMenu = document.getElementById("groupMenu");

CONFIG.grupos.forEach((group, index) => {
  const section = document.createElement("section");
  section.className = "menuGroup";

  const header = document.createElement("button");
  header.className = "groupHeader";
  header.innerHTML = `
    <span class="groupLabel">
      <span>${group.icono}</span>
      <span>${group.nombre}</span>
    </span>
    <span class="chevron">⌄</span>
  `;

  const items = document.createElement("div");
  items.className = "groupItems";
  if(index !== 0) items.classList.add("collapsed");

  header.addEventListener("click", () => {
    items.classList.toggle("collapsed");
    header.classList.toggle("closed");
  });

  reportByGroup(group.id).forEach(report => {
    const btn = document.createElement("button");
    btn.className = "navReport";
    btn.innerHTML = `
      <span class="navIcon">${report.icono}</span>
      <span class="navText">${report.nombre}</span>
      <span class="navDot ${report.activo ? "dotReady" : "dotPending"}"></span>
    `;
    btn.addEventListener("click", () => openReport(report, btn));
    items.appendChild(btn);
  });

  section.appendChild(header);
  section.appendChild(items);
  groupMenu.appendChild(section);
});

/* Portada agrupada */
const homeGroups = document.getElementById("homeGroups");

CONFIG.grupos.forEach(group => {
  const wrap = document.createElement("section");
  wrap.className = "homeGroup";

  const heading = document.createElement("div");
  heading.className = "homeGroupTitle";
  heading.innerHTML = `<span>${group.icono}</span><h3>${group.nombre}</h3>`;
  wrap.appendChild(heading);

  const grid = document.createElement("div");
  grid.className = "cards";

  reportByGroup(group.id).forEach(report => {
    const card = document.createElement("button");
    card.className = "card";
    card.innerHTML = `
      <div class="cardIcon">${report.icono}</div>
      <div class="cardTitle">${report.nombre}</div>
      <span class="badge ${report.activo ? "readyBadge" : "pendingBadge"}">
        ${report.activo ? "Disponible" : "Próximamente"}
      </span>
    `;
    card.addEventListener("click", () => openReport(report, null));
    grid.appendChild(card);
  });

  wrap.appendChild(grid);
  homeGroups.appendChild(wrap);
});

document.getElementById("homeBtn").addEventListener("click", showHome);
document.getElementById("backHome").addEventListener("click", showHome);

openExternal.addEventListener("click", () => {
  if(currentUrl) window.open(currentUrl, "_blank", "noopener");
});

showHome();
</script>
</body>
</html>
